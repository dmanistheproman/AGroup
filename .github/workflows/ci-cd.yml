# CI/CD pipeline (see README "CI/CD").
#   CI: unit tests on several OS/Python versions + frontend syntax checks, on every push and PR.
#   CD (Continuous Delivery): build the Docker image, run it as a staging environment and
#   smoke-test it; on main, publish the image to GitHub Packages. Production deploy is manual.
name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: "CI · tests (${{ matrix.os }}, Python ${{ matrix.python }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run unit tests
        run: python -m pytest backend/tests -q --junitxml=test-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results.xml

  frontend:
    name: "CI · frontend checks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax check
        run: for f in frontend/js/*.js; do echo "$f"; node --check "$f"; done

  staging:
    name: "CD · staging (Docker) + smoke test"
    needs: [test, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t agroup:${{ github.sha }} .
      - name: Start staging container
        run: |
          docker run -d --name agroup-staging -p 8000:8000 \
            -e AGROUP_SECRET_KEY="$(openssl rand -hex 32)" agroup:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/ > /dev/null && exit 0
            sleep 1
          done
          echo "Staging container did not start"; docker logs agroup-staging; exit 1
      - name: Smoke test
        run: python3 scripts/smoke_test.py http://127.0.0.1:8000
      - name: Start staging on generated test data (X-05)
        run: |
          docker run -d --name agroup-testdata -p 8001:8000             -e AGROUP_SECRET_KEY="$(openssl rand -hex 32)" -e AGROUP_DATABASE=/tmp/test-data.sqlite3             agroup:${{ github.sha }} sh -c 'python -c "from backend.data_generator import generate; generate(\"/tmp/test-data.sqlite3\")" && exec gunicorn --bind 0.0.0.0:8000 --workers 1 --threads 4 "backend.server:create_app()"'
          for i in $(seq 1 180); do
            curl -sf http://127.0.0.1:8001/ > /dev/null && exit 0
            sleep 1
          done
          echo "Test-data container did not start"; docker logs agroup-testdata; exit 1
      - name: Smoke test on generated test data
        run: python3 scripts/smoke_test.py http://127.0.0.1:8001
      - name: Container logs
        if: always()
        run: |
          docker logs agroup-staging || true
          docker logs agroup-testdata || true

  deliver:
    name: "CD · deliver image to GitHub Packages"
    needs: staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: How to deploy
        run: |
          {
            echo "### Image published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Deploy (manual): \`docker run -p 8000:8000 -e AGROUP_SECRET_KEY=<random> <image>\`"
          } >> "$GITHUB_STEP_SUMMARY"
